<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5F7F92">
<title>業務營地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#C9938A; --soft-pink:#E8C4BC; --light-pink:#F5E6E3;
  --blue:#7A9BAD; --soft-blue:#B8CFDA; --light-blue:#E3EDF3;
  --sage:#9AAE9B; --light-sage:#E8F0E8;
  --cream:#FAF3EE; --bg:#FAFAF8; --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;
  --primary:#5F7F92; --primary-dark:#4A6778;
  --oat:#F3ECE3; --sand:#EADFD2;
  --gold:#C3A26A; --light-gold:#F6EEDD; --orange:#E0915A; --light-orange:#FBEBDD;
  --card:#FFFFFF; --line:#EEE8E1;
  --shadow:0 2px 10px rgba(55,53,47,.06), 0 1px 2px rgba(55,53,47,.04);
  --shadow-lg:0 12px 40px rgba(55,53,47,.16);
  --r:16px; --r-sm:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--dark);font-family:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;font-size:15px;line-height:1.7;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.35}
a{color:var(--primary)}
.hidden{display:none!important}

/* ===== Header & nav ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(250,250,248,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;color:var(--primary-dark);white-space:nowrap}
.brand .logo{width:32px;height:32px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:17px}
.brand small{font-weight:500;color:var(--gray);font-size:12px;display:block;line-height:1}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{text-decoration:none;color:var(--medium);padding:7px 12px;border-radius:999px;font-weight:500;font-size:14px;white-space:nowrap}
.nav a.on{background:var(--light-blue);color:var(--primary-dark);font-weight:700}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{position:relative;border:0;background:transparent;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.icon-btn:hover{background:var(--oat)}
.badge-dot{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;line-height:17px;text-align:center}
.me-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px 4px 4px;font-size:14px;font-weight:500}
.me-btn .av{width:28px;height:28px;font-size:16px}
.bottom-nav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .brand small{display:none}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav a{flex:1;text-decoration:none;color:var(--gray);display:flex;flex-direction:column;align-items:center;font-size:11px;gap:1px;padding:4px 0;border-radius:10px}
  .bottom-nav a span{font-size:20px;line-height:1.2;filter:grayscale(.6);opacity:.8}
  .bottom-nav a.on{color:var(--primary-dark);font-weight:700}
  .bottom-nav a.on span{filter:none;opacity:1}
  body{padding-bottom:78px}
  .me-btn .nm{display:none}
  .me-btn{padding:4px}
}

/* ===== Layout ===== */
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 18px;flex-wrap:wrap}
.page-head h1{font-size:24px}
.page-head p{margin:2px 0 0;color:var(--gray);font-size:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
@media (max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.page-head h1{font-size:21px}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;border:1px solid rgba(238,232,225,.7)}
.card.tint{background:var(--cream)}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-title h3{font-size:16px}
.muted{color:var(--gray)}
.small{font-size:13px}
.xs{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
hr.sep{border:0;border-top:1px dashed var(--line);margin:14px 0}

/* ===== Buttons & inputs ===== */
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--oat);color:var(--dark);display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .1s, background .15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sand)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.gold{background:var(--gold);color:#fff}
.btn.orange{background:var(--orange);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:hover{background:var(--oat)}
.btn.danger{background:var(--light-pink);color:#A2584C}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.big{padding:16px 20px;font-size:17px;border-radius:16px}
.btn[disabled]{opacity:.5;pointer-events:none}
label.f{display:block;font-weight:700;font-size:14px;margin-bottom:6px;color:var(--medium)}
.field{margin-bottom:18px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none;transition:border .15s, box-shadow .15s}
.input:focus{border-color:var(--soft-blue);box-shadow:0 0 0 3px var(--light-blue)}
textarea.input{min-height:74px;resize:vertical;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--medium)}
.chip:hover{background:var(--oat)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:inline-flex;background:var(--oat);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--medium)}
.seg button.on{background:#fff;color:var(--primary-dark);font-weight:700;box-shadow:var(--shadow)}

/* ===== Avatars, tags, stamps ===== */
.av{width:40px;height:40px;border-radius:50%;background:var(--light-blue);display:grid;place-items:center;font-size:21px;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--oat);color:var(--medium);white-space:nowrap}
.tag.blue{background:var(--light-blue);color:var(--primary-dark)}
.tag.sage{background:var(--light-sage);color:#5E7A60}
.tag.gold{background:var(--light-gold);color:#8E6F37}
.tag.orange{background:var(--light-orange);color:#B0602A}
.tag.pink{background:var(--light-pink);color:#A2584C}
.stamp{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;border:3px double currentColor;font-weight:900;font-size:14px;transform:rotate(-14deg);letter-spacing:1px;line-height:1.1;text-align:center;flex-shrink:0;background:rgba(255,255,255,.6)}
.stamp.s-pass{color:var(--primary)}
.stamp.s-great{color:var(--gold)}
.stamp.s-hero{color:var(--orange)}
.stamp.sm{width:48px;height:48px;font-size:11px;border-width:3px}
.stars{color:var(--gold);letter-spacing:1px}

/* ===== Home ===== */
.announce{background:linear-gradient(135deg,var(--primary) 0%,#7C9AAC 100%);color:#fff;border:0}
.announce .muted{color:rgba(255,255,255,.75)}
.announce-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.announce-item:last-child{border-bottom:0}
.dinner-mini{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;margin-top:10px}
.streak-card{background:linear-gradient(160deg,#FFF9F2 0%,var(--light-gold) 100%);border:1px solid #F0E3CB}
.fire{font-size:40px;line-height:1}
.streak-num{font-size:34px;font-weight:900;color:#B0602A;line-height:1}
.exp-bar{height:12px;background:rgba(195,162,106,.18);border-radius:999px;overflow:hidden}
.exp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:999px;transition:width .6s}
.week-dots{display:flex;gap:6px}
.week-dots div{flex:1;text-align:center;font-size:11px;color:var(--gray)}
.week-dots b{display:grid;place-items:center;height:28px;border-radius:9px;background:rgba(255,255,255,.7);font-size:14px;margin-bottom:2px;border:1px dashed #E7D8BD}
.week-dots b.done{background:var(--orange);border:0;color:#fff}
.week-dots b.today{outline:2px solid var(--gold);outline-offset:1px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quick a{text-decoration:none;color:var(--dark);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:700;border:1px solid rgba(238,232,225,.7);transition:transform .15s}
.quick a:hover{transform:translateY(-2px)}
.quick a .e{font-size:28px}
.quick a small{font-weight:400;color:var(--gray);font-size:12px}
.kpi .v{font-size:28px;font-weight:900;color:var(--primary-dark);line-height:1.2}
.kpi .l{font-size:13px;color:var(--gray);font-weight:500}
.kpi .s{font-size:12px;color:var(--gray)}
.kpi .ic{font-size:20px}
@media (max-width:760px){.quick a{padding:12px 6px;font-size:13px}.quick a .e{font-size:24px}.kpi .v{font-size:24px}}

/* ===== Feed ===== */
.post{position:relative}
.post-head{display:flex;gap:10px;align-items:center}
.post-head .who{font-weight:700}
.nums{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.num-pill{background:var(--light-blue);border-radius:10px;padding:4px 10px;font-size:13px;color:var(--primary-dark)}
.num-pill b{font-size:15px;margin-left:2px}
.post-body p{margin:4px 0}
.post-body .k{font-weight:700;color:var(--medium);font-size:13px;margin-right:4px}
.post .stamp-float{position:absolute;right:16px;top:14px}
.review-box{margin-top:10px;background:var(--cream);border-radius:12px;padding:10px 12px;font-size:14px;border-left:3px solid var(--gold)}
.reacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.react{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-size:13px}
.react.on{background:var(--light-gold);border-color:#E7D2A8}
.post.has-stamp .post-body{padding-right:70px}
@media (max-width:760px){.post.has-stamp .post-body{padding-right:0}.post .stamp-float{top:10px;right:10px}.post .stamp-float .stamp{width:48px;height:48px;font-size:11px}}

/* ===== Log form ===== */
.stepper-wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stepper{background:var(--cream);border-radius:14px;padding:12px;text-align:center}
.stepper .lb{font-weight:700;font-size:14px;color:var(--medium)}
.stepper .ctl{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0}
.stepper .ctl button{width:36px;height:36px;border-radius:50%;border:0;background:#fff;box-shadow:var(--shadow);font-size:20px;font-weight:700;color:var(--primary)}
.stepper .ctl input{width:56px;text-align:center;border:0;background:transparent;font-size:28px;font-weight:900;color:var(--primary-dark);outline:none;-moz-appearance:textfield}
.stepper .ctl input::-webkit-outer-spin-button,.stepper .ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input[type=range]{width:100%;accent-color:var(--primary)}
@media (max-width:520px){.stepper-wrap{grid-template-columns:1fr}.stepper{display:grid;grid-template-columns:70px 1fr;align-items:center;text-align:left;padding:8px 12px}.stepper .ctl{justify-content:flex-end;margin:0}.stepper input[type=range]{grid-column:1/-1}}
.dinner-opt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dinner-opt button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-weight:700;font-size:15px}
.dinner-opt button.on{border-color:var(--orange);background:var(--light-orange);color:#A0562A}
.submit-bar{position:sticky;bottom:12px;z-index:5}
@media (max-width:760px){.submit-bar{bottom:84px}}

/* ===== Bingo ===== */
.bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:460px;margin:0 auto;perspective:900px}
.cell{position:relative;aspect-ratio:1/1;border:0;padding:0;background:transparent;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1)}
.cell .face{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;box-shadow:var(--shadow)}
.cell .front{background:#fff;border:2px dashed var(--soft-blue)}
.cell .front .n{font-size:11px;color:var(--gray);font-weight:700}
.cell .front .t{font-size:14px;font-weight:700;color:var(--medium);line-height:1.35}
.cell .back{background:linear-gradient(145deg,var(--light-gold),#F3DDBF);transform:rotateY(180deg);border:2px solid #E7CFA2}
.cell .back .t{font-size:12px;color:#8E6F37;font-weight:500;line-height:1.3;margin-top:4px}
.cell .clear{border:3px double #C2622A;color:#C2622A;font-weight:900;font-size:15px;padding:2px 8px;border-radius:8px;transform:rotate(-12deg);letter-spacing:2px;background:rgba(255,255,255,.5)}
.cell.done{transform:rotateY(180deg)}
.cell.inline .back{box-shadow:0 0 0 3px var(--orange),0 6px 20px rgba(224,145,90,.45)}
.cell[disabled]{cursor:default}
@media (max-width:520px){.cell .front .t{font-size:12px}.cell .clear{font-size:12px}.cell .back .t{font-size:10.5px}}
.lines-badge{font-size:40px;font-weight:900;color:var(--orange);line-height:1}
.reward{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.reward:last-child{border-bottom:0}
.reward .ico{width:40px;height:40px;border-radius:12px;background:var(--oat);display:grid;place-items:center;font-size:20px;flex-shrink:0;filter:grayscale(1);opacity:.6}
.reward.unlocked .ico{background:var(--light-gold);filter:none;opacity:1}
.pbar{height:8px;background:var(--oat);border-radius:999px;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--primary);border-radius:999px}
.reward.unlocked .pbar i{background:linear-gradient(90deg,var(--gold),var(--orange))}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.dims{grid-template-columns:1fr}}
.dim{border-radius:14px;padding:12px}
.dim h4{font-size:14px;margin-bottom:6px}
.dim.d1{background:var(--light-blue)}.dim.d2{background:var(--light-sage)}.dim.d3{background:var(--light-pink)}.dim.d4{background:var(--light-gold)}
.dim textarea{background:rgba(255,255,255,.8);border-color:transparent}
.mini-bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:66px}
.mini-bingo i{aspect-ratio:1/1;border-radius:4px;background:var(--oat)}
.mini-bingo i.on{background:var(--orange)}

/* ===== List / table ===== */
.filters{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--gray);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:#FDFBF8}
.clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.list-cards{display:none}
@media (max-width:760px){.tbl-wrap.resp{display:none}.list-cards{display:grid;gap:12px}}
.empty{text-align:center;padding:36px 12px;color:var(--gray)}
.empty .e{font-size:40px}

/* ===== HQ ===== */
.hq-log{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media (max-width:900px){.hq-log{grid-template-columns:1fr}}
.grade-panel{background:var(--cream);border-radius:14px;padding:12px}
.stamp-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stamp-pick button{border:2px solid transparent;background:#fff;border-radius:12px;padding:8px 4px;font-weight:700;font-size:13px}
.stamp-pick button.s-pass{color:var(--primary)}.stamp-pick button.s-great{color:#9E7F45}.stamp-pick button.s-hero{color:#C0662D}
.stamp-pick button.on{border-color:currentColor;background:#FFFDF8}
.star-pick button{border:0;background:transparent;font-size:22px;padding:0 2px;filter:grayscale(1);opacity:.35}
.star-pick button.on{filter:none;opacity:1}
.help-flag{background:var(--light-orange);color:#A0562A;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
.dinner-table td,.dinner-table th{padding:8px 10px}

/* ===== Modal / toast / celebrate ===== */
.overlay{position:fixed;inset:0;background:rgba(55,53,47,.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.modal{background:var(--bg);border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;padding:20px;animation:pop .25s cubic-bezier(.3,1.4,.5,1)}
.modal.wide{max-width:1000px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.modal-head h3{font-size:18px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.toasts{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{pointer-events:auto;background:var(--dark);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-lg);font-size:14px;animation:pop .25s;display:flex;gap:10px;align-items:flex-start}
.toast.gold{background:linear-gradient(135deg,#8E6F37,var(--gold))}
.toast .x{margin-left:auto;background:transparent;border:0;color:#fff;opacity:.7;font-size:16px}
.toast .btn{margin-top:6px}
.celebrate{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(55,53,47,.35);animation:fade .2s;padding:16px}
.celebrate-card{background:#fff;border-radius:24px;padding:28px 24px;text-align:center;max-width:360px;width:100%;box-shadow:var(--shadow-lg);animation:bounceIn .6s cubic-bezier(.3,1.6,.5,1);position:relative}
.celebrate-card .big{font-size:60px;line-height:1}
.celebrate-card h2{font-size:24px;margin:10px 0 4px;color:var(--primary-dark)}
.celebrate-card .gain{display:inline-block;margin:10px 0;background:var(--light-gold);color:#8E6F37;font-weight:900;padding:6px 16px;border-radius:999px;font-size:18px}
.celebrate-card .stamp{position:absolute;right:16px;top:14px;animation:stampIn .5s .35s both}
@keyframes bounceIn{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes stampIn{0%{opacity:0;transform:scale(2.4) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(-14deg)}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:160;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.notif{display:flex;gap:10px;padding:12px;border-radius:12px;background:#fff;margin-bottom:8px;border:1px solid var(--line)}
.notif.unread{border-color:var(--gold);background:#FFFCF6}
.notif .ic{font-size:22px}

/* ===== Review card print ===== */
.review-card{background:#fff;border-radius:18px;padding:18px;border:1px solid var(--line)}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%}
  .no-print{display:none!important}
}

<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><div class="logo">⛺</div><div><span id="teamName">業務營地</span><small>每日戰績・賓果・復盤</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="top-actions">
      <button class="icon-btn" onclick="App.openInbox()" title="通知" aria-label="通知">🔔<span id="bell" class="badge-dot hidden"></span></button>
      <button class="icon-btn" onclick="location.hash='#settings'" title="設定與備份" aria-label="設定與備份">⚙️</button>
      <button class="me-btn" onclick="App.openSwitch()" id="meBtn"></button>
    </div>
  </div>
</header>
<main id="app"></main>
<nav class="bottom-nav" id="bnav"></nav>
<div class="toasts" id="toasts"></div>
<div id="layer"></div>

<script>
(function(){
'use strict';
/* =========================================================
   常數與工具
   ========================================================= */
const KEY = 'ling-camp-v1';
const STAMPS = {
  '合格':  {cls:'s-pass',  exp:5,  emoji:'✅', text:'合格'},
  '優秀':  {cls:'s-great', exp:10, emoji:'🌟', text:'優秀'},
  '神隊友':{cls:'s-hero',  exp:20, emoji:'🦸', text:'神隊友'}
};
const HELP_OPTS = ['無','需主管陪訪','理賠諮詢','保單檢視','其他'];
const REACTS = ['👏','🔥','💪'];
const QUICK_COMMENTS = ['表現極佳！繼續保持！','節奏穩定，很棒 👍','今天的面談超有料 🔥','需要支援隨時說，我陪你！','明日重點很清楚，衝！','謝謝你幫團隊補位 🙌'];
const LEVELS = [['見習新秀',0],['行動派',200],['開拓者',500],['攻城手',900],['王牌戰將',1400],['傳奇領隊',2000],['殿堂之星',3000]];
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const REWARD_TYPES = {
  'personal-lines':   {label:'個人賓果連線數', unit:'條', scope:'個人'},
  'personal-cells':   {label:'個人賓果完成格數', unit:'格', scope:'個人'},
  'personal-meetings':{label:'個人本期面談數', unit:'次', scope:'個人'},
  'team-meetings':    {label:'全區本期面談數', unit:'次', scope:'全區'},
  'team-logs':        {label:'全區本期戰報數', unit:'份', scope:'全區'},
  'team-lines':       {label:'全區賓果連線總數', unit:'條', scope:'全區'}
};
const AVATARS = ['🦊','🐯','🐰','🐻','🐼','🐨','🦁','🐶','🐱','🐧','🦉','🐳','🌻','🚀','⭐','🍀'];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br = s => esc(s).replace(/\n/g,'<br>');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => dstr(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return dstr(d); };
const nowHM = () => { const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const fmtTime = iso => { if(!iso) return ''; const d = new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const WD = ['日','一','二','三','四','五','六'];
const fmtDate = s => { const d = parseD(s); return (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'; };
const isWeekend = s => { const w = parseD(s).getDay(); return w===0 || w===6; };
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));

/* =========================================================
   資料層
   ========================================================= */
let S = null;

function cycleLabel(start){
  const d = parseD(start), y = d.getFullYear(), q = Math.floor(d.getMonth()/3)+1;
  const qs = new Date(y,(q-1)*3,1);
  const n = Math.floor((d - qs)/(14*864e5))+1;
  return y+' Q'+q+'-W'+n;
}
function mondayOf(s){ const d = parseD(s); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return dstr(d); }

function defaultSettings(){
  return {
    teamName:'業務營地', dinnerCutoff:'16:00', remindTime:'20:00', expPerLog:20, skipWeekend:true,
    dinnerMenu:['雞腿便當','排骨便當','素食便當','鯖魚便當','牛肉麵','沙拉輕食']
  };
}

function seed(withDemo){
  const t = today();
  const members = [
    {id:'L1', name:'陳主管', avatar:'🦉', role:'leader'},
    {id:'m1', name:'小安', avatar:'🦊', role:'member'},
    {id:'m2', name:'阿哲', avatar:'🐯', role:'member'},
    {id:'m3', name:'佳佳', avatar:'🐰', role:'member'},
    {id:'m4', name:'志明', avatar:'🐻', role:'member'},
    {id:'m5', name:'美玲', avatar:'🐼', role:'member'}
  ];
  const start = mondayOf(t);
  const cycle = {
    id:'c1', label:cycleLabel(start), start, end:addDays(start,13),
    goals:['完成 3 次陪訪','新件簽單 1 件','面談 10 次','轉介紹 2 位','保單健檢 3 份','參加 2 次夜訓','連續回報 10 天','分享 1 則成功故事','約訪 15 次'],
    rewards:[
      {id:'r1', name:'主管請手搖飲', icon:'🧋', type:'personal-lines', target:1},
      {id:'r2', name:'下午茶券一張', icon:'🍰', type:'personal-lines', target:3},
      {id:'r3', name:'神秘大禮包',   icon:'🎁', type:'personal-cells', target:9},
      {id:'r4', name:'全區披薩派對', icon:'🍕', type:'team-meetings',  target:60},
      {id:'r5', name:'主管請喝下午茶', icon:'☕', type:'team-logs',    target:50}
    ]
  };
  const st = {
    v:1, settings:defaultSettings(), members: withDemo ? members : [members[0]],
    currentUserId: withDemo ? 'm1' : 'L1',
    announcements:[], logs:[], dinners:{}, cycles:[cycle], cards:[], notifications:[], runs:{}
  };
  st.announcements.push({id:uid(), date:t, icon:'📢', text:'明早 09:00 早會｜地點：12F 大會議室，請帶本週名單'});
  st.announcements.push({id:uid(), date:t, icon:'🎯', text:'本週主題：轉介紹話術演練，夜訓 19:00 開始'});
  if(!withDemo) return st;

  // 示範戰報（決定性亂數）
  let seedN = 7;
  const rnd = () => { seedN = (seedN*9301+49297)%233280; return seedN/233280; };
  const results = ['完成 2 位老客戶保單健檢','新客戶 A 同意下週面談','簽下一張醫療險！','拿到 3 位轉介紹名單','陪同學長完成理賠說明','整理客戶名單 30 筆','重新聯繫 5 位舊客戶'];
  const progress = ['王先生家庭保障規劃書已送出','李小姐等待體檢報告','張家三口 儲蓄險比較中','陳老闆 團保需求訪談完成','林太太 考慮長照險'];
  const tomorrow = ['上午約 2 位面談','追蹤李小姐體檢','準備轉介紹話術','整理明日拜訪路線','複習理賠流程'];
  const comments = ['表現極佳！繼續保持！','節奏穩定，很棒 👍','今天的面談超有料 🔥','需要支援隨時說，我陪你！'];
  const stampKeys = Object.keys(STAMPS);
  const mem = members.filter(m=>m.role==='member');
  for(let back=12; back>=0; back--){
    const d = addDays(t,-back);
    if(isWeekend(d)) continue;
    mem.forEach((m,i) => {
      if(back===0 && i>=3) return;              // 今天只有 3 人送出
      if(back>0 && rnd()<0.15 && i!==0) return; // 偶爾漏報（小安全勤）
      const hr = 17+Math.floor(rnd()*4);
      const sub = parseD(d); sub.setHours(hr, Math.floor(rnd()*60));
      const log = {
        id:uid(), date:d, userId:m.id, submittedAt:sub.toISOString(),
        contacts:5+Math.floor(rnd()*15), appointments:1+Math.floor(rnd()*5), meetings:Math.floor(rnd()*4),
        caseProgress:progress[Math.floor(rnd()*progress.length)], result:results[Math.floor(rnd()*results.length)],
        help: rnd()<0.25 ? HELP_OPTS[1+Math.floor(rnd()*3)] : '無', helpNote:'',
        tomorrow:tomorrow[Math.floor(rnd()*tomorrow.length)],
        review:{status:'未看'}, reactions:{}
      };
      if(back>0 || i===0){
        const sk = stampKeys[Math.floor(rnd()*3)];
        log.review = {status:'已批改', stamp:sk, stars:1+Math.floor(rnd()*3), comment:comments[Math.floor(rnd()*comments.length)], reviewedAt:sub.toISOString()};
      }
      if(rnd()<0.5) log.reactions['👏'] = ['m2','m3'].filter(x=>x!==m.id);
      if(rnd()<0.3) log.reactions['🔥'] = ['L1'];
      st.logs.push(log);
    });
  }
  // 今晚晚餐
  st.dinners[t] = {
    m1:{eat:true, item:'雞腿便當', note:'飯少', at:new Date().toISOString()},
    m2:{eat:true, item:'排骨便當', note:'', at:new Date().toISOString()},
    m3:{eat:false, item:'', note:'', at:new Date().toISOString()},
    m4:{eat:true, item:'素食便當', note:'不要辣', at:new Date().toISOString()}
  };
  // 賓果卡
  const doneSets = {m1:[0,1,2,4],m2:[0,4,8,3],m3:[1,4],m4:[2,5,8,0,4,6],m5:[]};
  mem.forEach(m => {
    const done = Array(9).fill(false); (doneSets[m.id]||[]).forEach(i=>done[i]=true);
    st.cards.push({id:uid(), cycleId:'c1', userId:m.id, done, review:{exp:'',learn:'',improve:'',next:''}, updatedAt:new Date().toISOString()});
  });
  const c2 = st.cards.find(c=>c.userId==='m2');
  c2.review = {exp:'第一次獨立完成家庭保障規劃，客戶當場說謝謝，很有成就感。', learn:'需求面談要先聽 70%、說 30%。', improve:'約訪量偏低，需要固定時段打電話。', next:'每天 10:00–11:00 固定約訪時段，目標每週 8 次約訪。'};
  st.notifications.push({id:uid(), userId:'m1', icon:'🖋️', text:'主管已為你的今日戰報簽章：『表現極佳！繼續保持！』', time:new Date().toISOString(), read:false});
  return st;
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ S = JSON.parse(raw); }
  }catch(e){ S = null; }
  if(!S || !S.members){ S = seed(true); save(); }
  S.settings = Object.assign(defaultSettings(), S.settings||{});
  ['announcements','logs','cycles','cards','notifications','members'].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
  S.dinners = S.dinners || {}; S.runs = S.runs || {};
  if(!S.members.find(m=>m.id===S.currentUserId)) S.currentUserId = (S.members[0]||{}).id;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('⚠️ 儲存失敗：瀏覽器儲存空間可能已滿，請先匯出備份'); }
}

/* ---------- 查詢 / 計算 ---------- */
const me = () => S.members.find(m=>m.id===S.currentUserId) || S.members[0];
const isLeader = () => (me()||{}).role === 'leader';
const member = id => S.members.find(m=>m.id===id) || {id, name:'（已移除）', avatar:'👤', role:'member'};
const teamMembers = () => S.members.filter(m=>m.role==='member');
const logOf = (uidv, d) => S.logs.find(l=>l.userId===uidv && l.date===d);
const logsOf = uidv => S.logs.filter(l=>l.userId===uidv);

function streakOf(userId){
  const dates = new Set(logsOf(userId).map(l=>l.date));
  let d = today(), n = 0;
  if(!dates.has(d)) d = addDays(d,-1);
  for(let i=0;i<500;i++){
    if(dates.has(d)){ n++; }
    else if(!(S.settings.skipWeekend && isWeekend(d))) break;
    d = addDays(d,-1);
  }
  return n;
}
function linesOf(done){ return LINES.filter(l=>l.every(i=>done[i])).length; }
function lineCells(done){ const s = new Set(); LINES.forEach(l=>{ if(l.every(i=>done[i])) l.forEach(i=>s.add(i)); }); return s; }
function reviewComplete(r){ return r && ['exp','learn','improve','next'].every(k=>(r[k]||'').trim()); }

function expOf(userId){
  let e = 0; const b = {logs:0, stamps:0, stars:0, bingo:0, review:0, streak:0};
  logsOf(userId).forEach(l => {
    b.logs += S.settings.expPerLog;
    if(l.review && l.review.status==='已批改'){
      b.stamps += (STAMPS[l.review.stamp]||{exp:0}).exp;
      b.stars += (l.review.stars||0)*2;
    }
  });
  S.cards.filter(c=>c.userId===userId).forEach(c => {
    b.bingo += linesOf(c.done)*30 + c.done.filter(Boolean).length*5;
    if(reviewComplete(c.review)) b.review += 40;
  });
  b.streak = Math.floor(streakOf(userId)/5)*25;
  e = Object.values(b).reduce((a,v)=>a+v,0);
  return {total:e, b};
}
function levelOf(exp){
  let i = 0; while(i+1<LEVELS.length && exp>=LEVELS[i+1][1]) i++;
  const cur = LEVELS[i], nxt = LEVELS[i+1];
  const pct = nxt ? (exp-cur[1])/(nxt[1]-cur[1])*100 : 100;
  return {lv:i+1, title:cur[0], next:nxt?nxt[1]:null, pct:clamp(pct,0,100)};
}

function currentCycle(){
  const t = today();
  const sorted = S.cycles.slice().sort((a,b)=>a.start<b.start?1:-1);
  return sorted.find(c=>c.start<=t && c.end>=t) || sorted[0] || null;
}
function cardOf(userId, cycleId){
  let c = S.cards.find(x=>x.userId===userId && x.cycleId===cycleId);
  if(!c){ c = {id:uid(), cycleId, userId, done:Array(9).fill(false), review:{exp:'',learn:'',improve:'',next:''}, updatedAt:new Date().toISOString()}; S.cards.push(c); }
  return c;
}
function rewardProgress(r, userId, cycle){
  const inCycle = l => l.date>=cycle.start && l.date<=cycle.end;
  let cur = 0;
  const card = S.cards.find(x=>x.userId===userId && x.cycleId===cycle.id);
  switch(r.type){
    case 'personal-lines': cur = card ? linesOf(card.done) : 0; break;
    case 'personal-cells': cur = card ? card.done.filter(Boolean).length : 0; break;
    case 'personal-meetings': cur = S.logs.filter(l=>l.userId===userId && inCycle(l)).reduce((a,l)=>a+(+l.meetings||0),0); break;
    case 'team-meetings': cur = S.logs.filter(inCycle).reduce((a,l)=>a+(+l.meetings||0),0); break;
    case 'team-logs': cur = S.logs.filter(inCycle).length; break;
    case 'team-lines': cur = S.cards.filter(c=>c.cycleId===cycle.id).reduce((a,c)=>a+linesOf(c.done),0); break;
  }
  return {cur, target:+r.target||1, ok: cur >= (+r.target||1)};
}
function dinnerSummary(d){
  const list = Object.entries(S.dinners[d]||{}).map(([u,v])=>Object.assign({userId:u},v));
  const eat = list.filter(x=>x.eat);
  const items = {};
  eat.forEach(x=>{ const k = x.item || '未指定'; items[k] = (items[k]||0)+1; });
  const notReplied = S.members.filter(m=>!(S.dinners[d]||{})[m.id]);
  return {eat, no:list.filter(x=>!x.eat), items, notReplied};
}
function dinnerText(d){
  const s = dinnerSummary(d);
  let t = '🍱 '+fmtDate(d)+' 夜訓晚餐｜共 '+s.eat.length+' 份\n';
  t += '— 品項統計 —\n' + (Object.entries(s.items).map(([k,v])=>'・'+k+' × '+v).join('\n') || '（無）') + '\n';
  t += '— 訂餐名單 —\n' + (s.eat.map((x,i)=>(i+1)+'. '+member(x.userId).name+'｜'+(x.item||'未指定')+(x.note?'（'+x.note+'）':'')).join('\n') || '（無）');
  if(s.no.length) t += '\n— 不吃 —\n' + s.no.map(x=>member(x.userId).name).join('、');
  return t;
}
function notify(userId, icon, text){
  S.notifications.unshift({id:uid(), userId, icon, text, time:new Date().toISOString(), read:false});
  if(S.notifications.length>300) S.notifications.length = 300;
}

/* =========================================================
   UI 基礎：toast / modal / 慶祝動畫
   ========================================================= */
function toast(html, opts){
  opts = opts||{};
  const el = document.createElement('div');
  el.className = 'toast'+(opts.gold?' gold':'');
  el.innerHTML = '<div style="flex:1">'+html+'</div><button class="x" aria-label="關閉">✕</button>';
  el.querySelector('.x').onclick = () => el.remove();
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(), opts.ms || 3200);
  return el;
}
function openModal(html, wide){
  const layer = $('#layer');
  layer.innerHTML = '<div class="overlay" id="ov"><div class="modal'+(wide?' wide':'')+'" role="dialog">'+html+'</div></div>';
  $('#ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
}
function closeModal(){ $('#layer').innerHTML = ''; }
function confetti(n){
  const colors = ['#C3A26A','#E0915A','#7A9BAD','#9AAE9B','#C9938A','#B8CFDA'];
  for(let i=0;i<(n||60);i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = (1.8+Math.random()*1.8)+'s';
    c.style.animationDelay = (Math.random()*0.4)+'s';
    c.style.opacity = .9;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4200);
  }
}
function celebrate(html){
  const el = document.createElement('div');
  el.className = 'celebrate';
  el.innerHTML = '<div class="celebrate-card">'+html+'<div style="margin-top:14px"><button class="btn primary block" id="celOk">太好了！</button></div></div>';
  document.body.appendChild(el);
  confetti(70);
  const close = () => el.remove();
  el.querySelector('#celOk').onclick = close;
  el.addEventListener('click', e=>{ if(e.target===el) close(); });
}
function copyText(t){
  const done = () => toast('📋 已複製到剪貼簿');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done, ()=>fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('無法自動複製，請手動選取'); }
    ta.remove();
  }
}
function download(name, content, type){
  const blob = new Blob([content], {type: type||'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
const csvCell = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';

/* =========================================================
   外框：導覽列 / 身分
   ========================================================= */
function navItems(){
  const items = [['home','🏕️','營地大廳'],['log','✍️','寫戰報'],['bingo','🎯','賓果復盤'],['list','📚','戰報清單']];
  if(isLeader()) items.push(['hq','🧭','指揮台']);
  return items;
}
function renderShell(route){
  $('#teamName').textContent = S.settings.teamName;
  document.title = S.settings.teamName;
  const items = navItems();
  $('#nav').innerHTML = items.map(([k,e,t])=>'<a href="#'+k+'" class="'+(route===k?'on':'')+'">'+e+' '+t+'</a>').join('');

let feedFilter = 'today';

function kpi(ic,l,v,s){ return '<div class="card kpi"><div class="row between"><span class="l">'+l+'</span><span class="ic">'+ic+'</span></div><div class="v">'+v+'</div><div class="s">'+esc(s)+'</div></div>'; }

function streakCard(m){
  const st = streakOf(m.id), ex = expOf(m.id), lv = levelOf(ex.total), t = today();
  const doneToday = !!logOf(m.id,t);
  let h = '<div class="card streak-card"><div class="card-title"><h3>🔥 我的連勝牆</h3><button class="btn sm ghost" onclick="App.expRules()">EXP 怎麼算？</button></div>';
  h += '<div class="row" style="gap:14px"><div class="fire">'+(st>0?'🔥':'🌱')+'</div><div><div class="streak-num">'+st+' <span style="font-size:15px">天</span></div><div class="small muted">連續打卡'+(doneToday?'・今日已完成 ✅':'・今天還沒打卡喔')+'</div></div>';
  h += '<div style="margin-left:auto;text-align:right"><span class="tag gold">Lv.'+lv.lv+' '+lv.title+'</span><div class="xs muted" style="margin-top:4px">'+ex.total+' EXP</div></div></div>';
  h += '<div style="margin:12px 0 4px" class="exp-bar"><i style="width:'+lv.pct+'%"></i></div>';
  h += '<div class="xs muted">'+(lv.next?'距離下一級還差 '+(lv.next-ex.total)+' EXP':'已達最高等級 👑')+'</div>';
  // 近 7 天
  h += '<div class="week-dots" style="margin-top:12px">';
  for(let i=6;i>=0;i--){
    const d = addDays(t,-i), ok = !!logOf(m.id,d);
    h += '<div><b class="'+(ok?'done':'')+(i===0?' today':'')+'">'+(ok?'✓':(isWeekend(d)?'·':''))+'</b>'+WD[parseD(d).getDay()]+'</div>';
  }
  h += '</div></div>';
  return h;
}

function bindLog(){
  const hc = $('#helpChips'); if(!hc) return;
  hc.onclick = e => { const b = e.target.closest('.chip'); if(!b) return;
    logDraft.help = b.dataset.v; hc.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on', x===b));
    $('#fHelpNote').classList.toggle('hidden', logDraft.help==='無'); };
  $('#dinnerOpt').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    logDraft.dinnerEat = b.dataset.v==='1';
    $('#dinnerOpt').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
    $('#dinnerMore').classList.toggle('hidden', !logDraft.dinnerEat); };
  $('#menuChips').onclick = e => { const b = e.target.closest('.chip'); if(!b) return;
    logDraft.dinnerItem = logDraft.dinnerItem===b.dataset.v ? '' : b.dataset.v;

}

let LF = {q:'', user:'', status:'', help:'', from:'', to:''};
function filteredLogs(){
  let arr = S.logs.slice();
  if(!isLeader() && LF.user==='') {/* 同仁預設看全部（透明） */}
  if(LF.user) arr = arr.filter(l=>l.userId===LF.user);
  if(LF.status) arr = arr.filter(l=>(l.review||{}).status===LF.status);
  if(LF.help==='need') arr = arr.filter(l=>l.help && l.help!=='無');
  else if(LF.help) arr = arr.filter(l=>l.help===LF.help);
  if(LF.from) arr = arr.filter(l=>l.date>=LF.from);
  if(LF.to) arr = arr.filter(l=>l.date<=LF.to);
  if(LF.q){
    const q = LF.q.toLowerCase();
    arr = arr.filter(l=>[member(l.userId).name,l.result,l.caseProgress,l.tomorrow,l.help,l.helpNote,(l.review||{}).comment].join(' ').toLowerCase().includes(q));
  }
  return arr.sort((a,b)=> a.date===b.date ? (a.submittedAt<b.submittedAt?1:-1) : (a.date<b.date?1:-1));
}
function pageList(){
  let h = '<div class="page-head"><div><h1>📚 戰報清單</h1><p>搜尋、篩選所有日戰報，也能匯出 CSV</p></div><div class="row"><a class="btn primary sm" href="#log">＋ 新增戰報</a><button class="btn ghost sm" onclick="App.exportCsv()">⬇️ 匯出 CSV</button></div></div>';
  h += '<div class="card" style="margin-bottom:16px"><div class="filters">';
  h += '<input class="input search" id="lfQ" placeholder="🔍 搜尋姓名、成果、案件、評語…" value="'+esc(LF.q)+'">';
  h += '<select class="input" id="lfUser"><option value="">全部同仁</option>'+S.members.map(m=>'<option value="'+m.id+'"'+(LF.user===m.id?' selected':'')+'>'+esc(m.avatar+' '+m.name)+'</option>').join('')+'</select>';
  h += '<select class="input" id="lfStatus"><option value="">批改狀態</option><option'+(LF.status==='未看'?' selected':'')+'>未看</option><option'+(LF.status==='已批改'?' selected':'')+'>已批改</option></select>';

  h += '<div class="row" style="flex-wrap:nowrap;gap:4px"><input type="date" class="input" id="lfFrom" value="'+esc(LF.from)+'" title="起"><input type="date" class="input" id="lfTo" value="'+esc(LF.to)+'" title="迄"></div>';

  h += '<div id="listBody"></div>';

}

    h += '<tr><td style="white-space:nowrap">'+fmtDate(l.date)+'<div class="xs muted">'+fmtTime(l.submittedAt)+'</div></td><td style="white-space:nowrap">'+esc(u.avatar+' '+u.name)+'</td>';
    h += '<td style="white-space:nowrap"><b>'+(+l.contacts||0)+'</b> / <b>'+(+l.appointments||0)+'</b> / <b>'+(+l.meetings||0)+'</b></td>';

    h += '<td>'+(l.help&&l.help!=='無'?'<span class="tag orange">'+esc(l.help)+'</span>':'<span class="muted xs">—</span>')+'</td><td>'+stampTag(l.review||{})+'</td>';

    const u = member(l.userId);
    h += '<div class="card"><div class="row between"><b>'+esc(u.avatar+' '+u.name)+'</b><span class="xs muted">'+fmtDate(l.date)+' '+fmtTime(l.submittedAt)+'</span></div>';
    h += '<div class="small" style="margin:6px 0">📞 '+(+l.contacts||0)+'・📅 '+(+l.appointments||0)+'・🤝 '+(+l.meetings||0)+'</div>';
    if(l.result) h += '<div class="small"><b>成果：</b>'+esc(l.result)+'</div>';
    if(l.caseProgress) h += '<div class="small"><b>進度：</b>'+esc(l.caseProgress)+'</div>';
    h += '<div class="row" style="margin-top:8px">'+stampTag(l.review||{})+(l.help&&l.help!=='無'?'<span class="tag orange">'+esc(l.help)+'</span>':'')+'<span style="margin-left:auto">'+actions(l)+'</span></div></div>';
  });
  h += '</div>';
  if(arr.length>200) h += '<div class="xs muted" style="text-align:center;margin-top:8px">僅顯示前 200 筆，請用篩選縮小範圍</div>';
  $('#listBody').innerHTML = h;
  function actions(l){
    let a = '<button class="btn sm ghost" onclick="App.viewLog(\''+l.id+'\')">看</button> ';
    if(canEdit(l)) a += '<a class="btn sm ghost" href="#log/'+l.id+'">改</a> <button class="btn sm danger" onclick="App.delLog(\''+l.id+'\')">刪</button>';

function hqGrade(){

  h += kpi('📝','已送出', logs.length+'<span class="small muted">/'+teamMembers().length+'</span>', fmtDate(d));
  h += kpi('🖋️','待批改', pend, pend?'加油，快改完了':'全部改完 🎉');
  h += kpi('🤝','面談合計', logs.reduce((a,l)=>a+(+l.meetings||0),0), '約訪 '+logs.reduce((a,l)=>a+(+l.appointments||0),0));

    h += '<div class="card tint" style="margin-bottom:16px"><div class="row between"><div><b>🌙 尚未送出（'+missing.length+'）</b><div class="small">'+missing.map(m=>esc(m.avatar+' '+m.name)).join('、')+'</div></div>';

    h += '<div class="nums"><span class="num-pill">📞 聯絡<b>'+(+l.contacts||0)+'</b></span><span class="num-pill">📅 約訪<b>'+(+l.appointments||0)+'</b></span><span class="num-pill">🤝 面談<b>'+(+l.meetings||0)+'</b></span></div>';
    if(l.help && l.help!=='無') h += '<div class="help-flag" style="margin-bottom:8px">🙋 '+esc(l.help)+(l.helpNote?'：'+esc(l.helpNote):'')+'</div>';

function bindGradePanels(root){
  (root||document).querySelectorAll('.grade-panel').forEach(p=>{
    p.onclick = e => {
      const b = e.target.closest('button'); if(!b) return;
      if(b.dataset.stamp){ p.dataset.stamp = b.dataset.stamp; p.querySelectorAll('[data-stamp]').forEach(x=>{ if(x.tagName==='BUTTON') x.classList.toggle('on', x===b); }); }
      else if(b.dataset.star){ p.dataset.stars = b.dataset.star; p.querySelectorAll('[data-star]').forEach(x=>x.classList.toggle('on', +x.dataset.star <= +b.dataset.star)); }
      else if(b.dataset.qc){ p.querySelector('textarea').value = b.dataset.qc; }
      else if(b.dataset.go){ applyGrade(p.dataset.log, p.dataset.stamp, +p.dataset.stars, p.querySelector('textarea').value.trim()); }
    };
  });
}

  toast('🖋️ 已蓋上「'+stamp+'」並通知 '+esc(member(l.userId).name), {gold:true});

/* =========================================================
   路由
   ========================================================= */
function route(){
  const hash = (location.hash||'#home').slice(1);
  const [page, param] = hash.split('/');
  const r = ['home','log','bingo','list','hq','settings'].includes(page) ? page : 'home';
  renderShell(r);
  const app = $('#app');
  const y = window.scrollY, sameView = app.dataset.view === hash;
  app.dataset.view = hash;
  if(r==='home'){ app.innerHTML = pageHome(); const fs = $('#feedSeg'); if(fs) fs.onclick = e=>{ const b = e.target.closest('button'); if(!b) return; feedFilter = b.dataset.f; route(); }; }
  else if(r==='log'){ app.innerHTML = pageLog(param); bindLog(); }
  else if(r==='bingo'){ app.innerHTML = pageBingo(); }
  else if(r==='list'){ app.innerHTML = pageList(); bindList(); }
  else if(r==='hq'){ app.innerHTML = pageHQ(param); bindGradePanels(app); const ic = $('#anIcon'); if(ic) ic.onclick = e=>{ const b=e.target.closest('.chip'); if(!b) return; ic.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b)); }; }
  else if(r==='settings'){ app.innerHTML = pageSettings(); }
  window.scrollTo(0, sameView ? y : 0);
}

/* =========================================================
   自動化排程（網頁開著時每 30 秒檢查一次）
   ========================================================= */
function browserNotify(title, body){
  try{ if('Notification' in window && Notification.permission==='granted') new Notification(title, {body}); }catch(e){}
}
function runAuto(force){
  const t = today(), hm = nowHM();
  S.runs[t] = S.runs[t] || {};
  const run = S.runs[t];
  let changed = false;
  // 1) 16:00 晚餐統計
  if((force || (hm >= S.settings.dinnerCutoff && !run.dinner))){
    if(!run.dinner){
      const s = dinnerSummary(t);
      S.members.filter(m=>m.role==='leader').forEach(l=>notify(l.id,'🍱','今日晚餐已自動統計：共 '+s.eat.length+' 份（'+(Object.entries(s.items).map(([k,v])=>k+'×'+v).join('、')||'無')+'），到指揮台一鍵複製名單'));
      run.dinner = true; changed = true;
    }
    if(isLeader()){
      const s = dinnerSummary(t);
      const el = toast('<b>🍱 '+S.settings.dinnerCutoff+' 晚餐統計完成</b><br>共 '+s.eat.length+' 份・'+s.notReplied.length+' 人未登記<br><button class="btn sm gold">📋 複製名單給負責人</button>', {ms:9000});
      el.querySelector('.btn').onclick = () => copyText(dinnerText(t));
      browserNotify('🍱 晚餐統計完成', '今晚共 '+s.eat.length+' 份，點開複製名單');
    }
  }
  // 2) 20:00 溫和提醒
  if((force || (hm >= S.settings.remindTime && !run.remind))){
    if(!run.remind){
      teamMembers().filter(m=>!logOf(m.id,t)).forEach(m=>notify(m.id,'🌙','今日戰報尚未送出，快來領取今日經驗值！🎁'));
      run.remind = true; changed = true;
    }
    const m = me();
    if(m.role==='member' && !logOf(m.id,t)){
      const el = toast('<b>🌙 今日戰報尚未送出</b><br>快來領取今日經驗值！🔥 連勝 '+streakOf(m.id)+' 天等你延續<br><button class="btn sm gold">✍️ 現在填寫</button>', {ms:9000, gold:true});
      el.querySelector('.btn').onclick = () => { location.hash = '#log'; el.remove(); };
      browserNotify('🌙 今日戰報尚未送出', '快來領取今日經驗值！');
    } else if(force && !isLeader()) toast('✅ 你今天已經送出戰報，提醒不會打擾你');
  }
  // 清掉 30 天前的排程紀錄
  Object.keys(S.runs).forEach(k=>{ if(k < addDays(t,-30)) delete S.runs[k]; });
  if(changed){ save(); renderShell((location.hash||'#home').slice(1).split('/')[0]); }
}

      location.hash = isNew ? '#home' : '#list';
    }
  },
  react(id, e){
    const l = S.logs.find(x=>x.id===id); if(!l) return;
    l.reactions = l.reactions || {}; const arr = l.reactions[e] = l.reactions[e] || [];
    const i = arr.indexOf(me().id);
    if(i>=0) arr.splice(i,1); else { arr.push(me().id); if(l.userId!==me().id) notify(l.userId, e, esc(me().name)+' 給你的戰報按了 '+e); }
    save(); route();
  },
  gradeModal(id){
    const l = S.logs.find(x=>x.id===id); if(!l) return;
    const u = member(l.userId);
    let h = '<div class="modal-head"><h3>🖋️ 批改 '+esc(u.name)+' 的戰報</h3><button class="icon-btn" onclick="App.close()">✕</button></div>';
    h += '<div class="small" style="margin-bottom:10px">'+fmtDate(l.date)+'・📞'+(+l.contacts||0)+' 📅'+(+l.appointments||0)+' 🤝'+(+l.meetings||0)+(l.result?'<br>🏆 '+esc(l.result):'')+'</div>';
    h += gradePanel(l);
    openModal(h); bindGradePanels($('#layer'));
  },
  viewLog(id){
    const l = S.logs.find(x=>x.id===id); if(!l) return;
    openModal('<div class="modal-head"><h3>📄 戰報內容</h3><button class="icon-btn" onclick="App.close()">✕</button></div>'+postCard(l)+(isLeader()?'':'')+'<div class="xs muted" style="margin-top:8px">'+(l.updatedAt?'最後修改：'+new Date(l.updatedAt).toLocaleString('zh-TW'):'')+'</div>');
  },
  delLog(id){
    const l = S.logs.find(x=>x.id===id); if(!l) return;
    if(!confirm('確定要刪除 '+member(l.userId).name+' '+fmtDate(l.date)+' 的戰報嗎？')) return;
    S.logs = S.logs.filter(x=>x.id!==id); save(); toast('🗑️ 已刪除'); route();
  },
  resetFilters(){ LF = {q:'',user:'',status:'',help:'',from:'',to:''}; route(); },
  exportCsv(){
    const arr = filteredLogs();
    const head = ['日期','填寫人','提交時間','聯絡','約訪','面談','案件進度','今日成果','需要協助','協助說明','明日重點','夜訓晚餐','晚餐備註','批改狀態','批改章','星號','主管評語'];
    const rows = arr.map(l=>{ const dn = (S.dinners[l.date]||{})[l.userId]; const r = l.review||{};
      return [l.date, member(l.userId).name, new Date(l.submittedAt).toLocaleString('zh-TW'), l.contacts, l.appointments, l.meetings, l.caseProgress, l.result, l.help, l.helpNote, l.tomorrow, dn?(dn.eat?'吃・'+(dn.item||''):'不吃'):'', dn?dn.note:'', r.status, r.stamp||'', r.stars||'', r.comment||''].map(csvCell).join(','); });
    download('戰報_'+today()+'.csv', '﻿'+head.map(csvCell).join(',')+'\n'+rows.join('\n'), 'text/csv;charset=utf-8');
  },
  bingoCycle(id){ bingoView.cycleId = id; route(); },
  bingoUser(id){ bingoView.userId = id; route(); },
  toggleCell(i){
    const cyc = S.cycles.find(c=>c.id===bingoView.cycleId); if(!cyc) return;
    const card = cardOf(me().id, cyc.id);
    const before = linesOf(card.done);
    const unlockedBefore = (cyc.rewards||[]).filter(r=>rewardProgress(r, me().id, cyc).ok).map(r=>r.id);
    card.done[i] = !card.done[i]; card.updatedAt = new Date().toISOString();
    const after = linesOf(card.done);
    const newly = (cyc.rewards||[]).filter(r=>rewardProgress(r, me().id, cyc).ok && !unlockedBefore.includes(r.id));
    save();
    // 先翻牌，再重畫
    const cells = document.querySelectorAll('.bingo .cell');
    if(cells[i]) cells[i].classList.toggle('done', card.done[i]);
    setTimeout(()=>{
      route();
      if(after > before){
        newly.forEach(r=>{ notify(me().id,'🎁','你解鎖了獎勵「'+r.name+'」！'); S.members.filter(x=>x.role==='leader').forEach(l=>notify(l.id,'🎯',me().name+' 解鎖了「'+r.name+'」')); });
        S.members.filter(x=>x.role==='leader').forEach(l=>notify(l.id,'🎯',me().name+' 的賓果達成 '+after+' 條連線！'));
        save(); renderShell('bingo');
        celebrate('<div class="big">🎯</div><h2>BINGO！</h2><div class="small muted">你完成了第 '+after+' 條連線</div><div class="gain">+30 EXP</div>'+(newly.length?'<div class="small" style="margin-top:6px">🔓 解鎖獎勵：<b>'+newly.map(r=>esc(r.icon+' '+r.name)).join('、')+'</b></div>':''));
      } else if(newly.length){
        newly.forEach(r=>notify(me().id,'🎁','你解鎖了獎勵「'+r.name+'」！')); save(); renderShell('bingo');
        celebrate('<div class="big">🎁</div><h2>獎勵解鎖！</h2><div class="gain">'+newly.map(r=>esc(r.icon+' '+r.name)).join('、')+'</div>');
      }
    }, 560);
  },
  reviewInput(el){
    const cyc = S.cycles.find(c=>c.id===bingoView.cycleId); if(!cyc) return;
    const card = cardOf(me().id, cyc.id);
    card.review = card.review || {}; card.review[el.dataset.k] = el.value; card.updatedAt = new Date().toISOString();
    clearTimeout(App._rt); App._rt = setTimeout(()=>{ save(); const s = $('#revSaved'); if(s) s.textContent = '✓ 已自動儲存 '+nowHM(); }, 600);
  },
  saveReview(){
    const cyc = S.cycles.find(c=>c.id===bingoView.cycleId); const card = cardOf(me().id, cyc.id);
    document.querySelectorAll('.dim textarea').forEach(t=>card.review[t.dataset.k] = t.value);
    const wasComplete = card._reviewNotified;
    save();
    if(reviewComplete(card.review) && !wasComplete){
      card._reviewNotified = true;
      S.members.filter(x=>x.role==='leader').forEach(l=>notify(l.id,'📝',me().name+' 完成了 '+cyc.label+' 的成長復盤'));
      save();
      celebrate('<div class="big">📝</div><h2>復盤完成！</h2><div class="small muted">看見自己的成長，就是最好的獎勵</div><div class="gain">+40 EXP</div>');
    } else toast('💾 復盤已儲存');
    route();
  },
  copyReview(){
    const cyc = S.cycles.find(c=>c.id===bingoView.cycleId);
    const card = cardOf(bingoView.userId, cyc.id), r = card.review||{}, u = member(bingoView.userId);
    const t = '📝 '+u.name+'｜'+cyc.label+' 成長復盤卡\n🎯 賓果 '+card.done.filter(Boolean).length+'/9 格、'+linesOf(card.done)+' 條連線\n'
      + '完成：'+cyc.goals.filter((g,i)=>card.done[i]).join('、')+'\n\n'
      + '🌈 體驗上：'+(r.exp||'')+'\n📖 學習上：'+(r.learn||'')+'\n🔧 再提升：'+(r.improve||'')+'\n🚀 我的下一步：'+(r.next||'');
    copyText(t);
  },
  meetingMode(){
    const cyc = S.cycles.find(c=>c.id===bingoView.cycleId) || currentCycle();
    let h = '<div class="modal-head"><h3>📽️ 復盤會議｜'+esc(cyc.label)+'</h3><button class="icon-btn" onclick="App.close()">✕</button></div>';
    h += '<div class="grid g2">';
    teamMembers().forEach(m=>{
      const c = S.cards.find(x=>x.userId===m.id && x.cycleId===cyc.id);
      const done = c ? c.done : Array(9).fill(false), r = (c&&c.review)||{};
      h += '<div class="review-card"><div class="row" style="margin-bottom:8px"><div class="av">'+esc(m.avatar)+'</div><div><b>'+esc(m.name)+'</b><div class="xs muted">'+done.filter(Boolean).length+'/9 格・'+linesOf(done)+' 連線</div></div><div class="mini-bingo" style="margin-left:auto">'+done.map(x=>'<i class="'+(x?'on':'')+'"></i>').join('')+'</div></div>';
      [['🌈 體驗上','exp'],['📖 學習上','learn'],['🔧 再提升','improve'],['🚀 我的下一步','next']].forEach(([t,k])=>{ h += '<div class="small" style="margin-top:4px"><b>'+t+'</b>　'+(r[k]?esc(r[k]):'<span class="muted">—</span>')+'</div>'; });
      h += '</div>';
    });
    h += '</div>';
    openModal(h, true);
  },
  hqDate(d){ hqDate = d; route(); },
  hqCycle(id){ hqCycleId = id; route(); },
  bulkPass(){
    const d = hqDate || today();
    const pend = S.logs.filter(l=>l.date===d && l.review.status!=='已批改');
    if(!pend.length || !confirm('將 '+pend.length+' 份未批改的戰報蓋上「合格 ⭐」並通知同仁？')) return;
    pend.forEach(l=>{ l.review = {status:'已批改', stamp:'合格', stars:1, comment:'穩穩完成，今天辛苦了！', reviewedAt:new Date().toISOString(), by:me().id};
      notify(l.userId,'🖋️','主管已為你的戰報簽章：「合格 ⭐」『穩穩完成，今天辛苦了！』'); });
    save(); toast('✅ 已批改 '+pend.length+' 份'); route();
  },
  nudge(d){
    const miss = teamMembers().filter(m=>!logOf(m.id,d));
    miss.forEach(m=>notify(m.id,'💌','今日戰報尚未送出，快來領取今日經驗值！🎁 有任何卡關也可以在戰報裡勾「需要協助」'));
    save(); toast('💌 已送出 '+miss.length+' 則溫和提醒'); renderShell('hq');
  },
  nudgeDinner(d){
    const s = dinnerSummary(d);
    s.notReplied.forEach(m=>notify(m.id,'🍱','今晚夜訓要不要一起吃晚餐？記得在 '+S.settings.dinnerCutoff+' 前登記喔'));
    save(); toast('💌 已提醒 '+s.notReplied.length+' 人'); renderShell('hq');
  },
  copyDinner(d){ copyText(dinnerText(d)); },
  dinnerCsv(d){
    const s = dinnerSummary(d);
    const rows = [['#','同仁','品項','備註','登記時間']].concat(s.eat.map((x,i)=>[i+1, member(x.userId).name, x.item||'未指定', x.note||'', fmtTime(x.at)]));
    download('晚餐_'+d+'.csv', '﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n'), 'text/csv;charset=utf-8');
  },
  addAnnounce(){
    const text = $('#anText').value.trim(); if(!text){ toast('請輸入公告內容'); return; }
    const icon = ($('#anIcon .chip.on')||{dataset:{v:'📢'}}).dataset.v;
    const date = $('#anDate').value || today();
    S.announcements.push({id:uid(), date, icon, text});
    S.members.filter(m=>m.id!==me().id).forEach(m=>notify(m.id, icon, '新公告（'+fmtDate(date)+'）：'+text));
    save(); toast('📢 公告已發布'); route();
  },
  delAnnounce(id){ if(!confirm('刪除這則公告？')) return; S.announcements = S.announcements.filter(a=>a.id!==id); save(); route(); },
  newCycle(){
    const last = S.cycles.slice().sort((a,b)=>a.start<b.start?1:-1)[0];
    const start = last ? addDays(last.end,1) : mondayOf(today());
    const c = {id:uid(), label:cycleLabel(start), start, end:addDays(start,13),
      goals: last ? last.goals.slice() : Array(9).fill(''), rewards: last ? last.rewards.map(r=>Object.assign({},r,{id:uid()})) : []};
    S.cycles.push(c); hqCycleId = c.id; save(); toast('🗺️ 已建立 '+esc(c.label)+'（沿用上一期目標，可直接修改）'); route();
  },
  collectCycle(){
    const cyc = S.cycles.find(c=>c.id===hqCycleId); if(!cyc) return null;
    cyc.label = $('#cyLabel').value.trim() || cyc.label;
    cyc.start = $('#cyStart').value || cyc.start; cyc.end = $('#cyEnd').value || cyc.end;
    document.querySelectorAll('.goal-in').forEach(inp=>cyc.goals[+inp.dataset.i] = inp.value.trim());
    cyc.rewards = Array.from(document.querySelectorAll('.rw-row')).map(row=>({
      id:row.dataset.id, icon:row.querySelector('.rw-icon').value.trim()||'🎁', name:row.querySelector('.rw-name').value.trim()||'未命名獎勵',
      type:row.querySelector('.rw-type').value, target:Math.max(1, +row.querySelector('.rw-target').value||1)
    }));
    return cyc;
  },
  saveCycle(){
    const cyc = App.collectCycle(); if(!cyc) return;
    if(cyc.end < cyc.start){ toast('⚠️ 結束日期不能早於開始日期'); return; }
    save(); toast('💾 賓果設定已儲存'); route();
  },
  addReward(){ const cyc = App.collectCycle(); cyc.rewards.push({id:uid(), icon:'🎁', name:'', type:'personal-lines', target:1}); save(); route(); },
  delReward(id){ const cyc = App.collectCycle(); cyc.rewards = cyc.rewards.filter(r=>r.id!==id); save(); route(); },
  delCycle(id){
    if(S.cycles.length<=1){ toast('至少要保留一期'); return; }
    if(!confirm('刪除這一期會一併刪除所有人在這期的賓果與復盤，確定嗎？')) return;
    S.cycles = S.cycles.filter(c=>c.id!==id); S.cards = S.cards.filter(c=>c.cycleId!==id); hqCycleId = null; save(); route();
  },
  memberModal(id){
    const m = id ? member(id) : {name:'', avatar:AVATARS[S.members.length % AVATARS.length], role:'member'};
    const canRole = isLeader();
    let h = '<div class="modal-head"><h3>'+(id?'✏️ 編輯成員':'＋ 新增成員')+'</h3><button class="icon-btn" onclick="App.close()">✕</button></div>';
    h += '<div class="field"><label class="f">名字</label><input class="input" id="mmName" value="'+esc(m.name)+'" placeholder="例：小安"></div>';
    h += '<div class="field"><label class="f">頭像</label><div class="chips" id="mmAv">'+AVATARS.map(a=>'<button type="button" class="chip'+(a===m.avatar?' on':'')+'" data-v="'+a+'" style="font-size:18px">'+a+'</button>').join('')+'</div></div>';
    if(canRole) h += '<div class="field"><label class="f">角色</label><select class="input" id="mmRole"><option value="member"'+(m.role==='member'?' selected':'')+'>同仁</option><option value="leader"'+(m.role==='leader'?' selected':'')+'>主管</option></select></div>';
    h += '<div class="row" style="justify-content:flex-end">'+(id&&canRole&&id!==me().id?'<button class="btn danger" style="margin-right:auto" onclick="App.delMember(\''+id+'\')">移除成員</button>':'')+'<button class="btn primary" id="mmSave">儲存</button></div>';
    openModal(h);
    let av = m.avatar;
    $('#mmAv').onclick = e=>{ const b=e.target.closest('.chip'); if(!b) return; av = b.dataset.v; $('#mmAv').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b)); };
    $('#mmSave').onclick = ()=>{
      const name = $('#mmName').value.trim(); if(!name){ toast('請輸入名字'); return; }
      const role = canRole ? $('#mmRole').value : m.role;
      if(id){
        const t = S.members.find(x=>x.id===id);
        if(t.role==='leader' && role!=='leader' && S.members.filter(x=>x.role==='leader').length<=1){ toast('⚠️ 至少需要一位主管'); return; }
        Object.assign(t,{name, avatar:av, role});
      } else S.members.push({id:uid(), name, avatar:av, role});
      save(); closeModal(); toast('✅ 已儲存'); route();
    };
  },
  delMember(id){
    if(!confirm('移除成員不會刪除他過去的戰報，確定移除？')) return;
    S.members = S.members.filter(m=>m.id!==id); save(); closeModal(); route();
  },
  saveSettings(){
    const s = S.settings;
    s.teamName = $('#stName').value.trim() || '業務營地';
    s.dinnerCutoff = $('#stCut').value || '16:00';
    s.remindTime = $('#stRemind').value || '20:00';
    s.expPerLog = Math.max(0, +$('#stExp').value || 0);
    s.dinnerMenu = $('#stMenu').value.split('\n').map(x=>x.trim()).filter(Boolean);
    s.skipWeekend = $('#stWeekend').checked;
    save(); toast('💾 規則已儲存'); route();
  },
  askPerm(){ if('Notification' in window) Notification.requestPermission().then(()=>route()); },
  runAuto(force){ runAuto(force); },
  exportJson(){
    download('業務營地備份_'+today()+'_'+nowHM().replace(':','')+'.json', JSON.stringify(Object.assign({_app:'ling-camp', _exportedAt:new Date().toISOString()}, S), null, 2), 'application/json');
    toast('⬇️ 備份已下載');
  },
  importJson(input){
    const f = input.files && input.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let data;
      try{ data = JSON.parse(rd.result); }catch(e){ toast('⚠️ 檔案格式錯誤，無法讀取'); return; }
      if(!data || !Array.isArray(data.members) || !Array.isArray(data.logs)){ toast('⚠️ 這不是本工具的備份檔'); return; }
      let h = '<div class="modal-head"><h3>⬆️ 匯入備份</h3><button class="icon-btn" onclick="App.close()">✕</button></div>';
      h += '<p class="small">檔案內有 <b>'+data.logs.length+'</b> 份戰報、<b>'+data.members.length+'</b> 位成員。要怎麼匯入？</p>';
      h += '<div class="stack"><button class="btn primary block" id="imMerge">🔀 合併（保留現有資料，加入/更新檔案內容）</button><button class="btn danger block" id="imReplace">♻️ 覆蓋（以檔案完全取代目前資料）</button></div>';
      openModal(h);
      $('#imMerge').onclick = ()=>{ mergeData(data); save(); closeModal(); toast('🔀 合併完成'); route(); };
      $('#imReplace').onclick = ()=>{ if(!confirm('目前資料會被完全取代，確定？')) return; const cur = S.currentUserId; delete data._app; delete data._exportedAt; S = data; load2(cur); save(); closeModal(); toast('♻️ 已覆蓋匯入'); route(); };
    };
    rd.readAsText(f);
    input.value = '';
  },
  resetData(demo){
    if(!confirm(demo?'重新載入示範資料？目前資料會被取代（建議先匯出備份）':'清空所有資料，從零開始？（建議先匯出備份）')) return;
    S = seed(demo); save(); toast(demo?'🎪 已載入示範資料':'🧹 已清空，先到指揮台新增成員吧'); location.hash = demo?'#home':'#hq/team'; route();
  }
};
function load2(cur){
  S.settings = Object.assign(defaultSettings(), S.settings||{});
  ['announcements','logs','cycles','cards','notifications','members'].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
  S.dinners = S.dinners || {}; S.runs = S.runs || {};
  if(S.members.find(m=>m.id===cur)) S.currentUserId = cur;
  if(!S.members.find(m=>m.id===S.currentUserId)) S.currentUserId = (S.members[0]||{}).id;
}
function mergeData(d){
  const byId = (a, b, newer) => { const map = new Map(a.map(x=>[x.id,x])); (b||[]).forEach(x=>{ const cur = map.get(x.id); if(!cur || !newer || newer(x,cur)) map.set(x.id, x); }); return Array.from(map.values()); };
  const stamp = x => x.updatedAt || (x.review&&x.review.reviewedAt) || x.submittedAt || '';
  S.members = byId(S.members, d.members);
  S.logs = byId(S.logs, d.logs, (inc,cur)=> stamp(inc) >= stamp(cur));
  // 同一人同一天只保留一份
  const seen = new Map();
  S.logs.forEach(l=>{ const k = l.userId+'|'+l.date; const c = seen.get(k); if(!c || stamp(l) > stamp(c)) seen.set(k,l); });
  S.logs = Array.from(seen.values());
  S.announcements = byId(S.announcements, d.announcements);
  S.cycles = byId(S.cycles, d.cycles);
  S.cards = byId(S.cards, d.cards, (inc,cur)=> (inc.updatedAt||'') >= (cur.updatedAt||''));
  const seenC = new Map();
  S.cards.forEach(c=>{ const k = c.userId+'|'+c.cycleId; const o = seenC.get(k); if(!o || (c.updatedAt||'') > (o.updatedAt||'')) seenC.set(k,c); });
  S.cards = Array.from(seenC.values());
  S.notifications = byId(S.notifications, d.notifications);
  Object.entries(d.dinners||{}).forEach(([day,obj])=>{ S.dinners[day] = S.dinners[day] || {}; Object.entries(obj).forEach(([u,v])=>{ const c = S.dinners[day][u]; if(!c || (v.at||'') >= (c.at||'')) S.dinners[day][u] = v; }); });
}

/* =========================================================
   啟動
   ========================================================= */
load();
window.addEventListener('hashchange', route);
route();
setTimeout(()=>runAuto(false), 800);
setInterval(()=>runAuto(false), 30000);
// 跨日自動刷新
let lastDay = today();
setInterval(()=>{ if(today()!==lastDay){ lastDay = today(); route(); } }, 60000);
})();
